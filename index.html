<style>
:root,[data-theme=crimson]{--bg:#0b0708;--p:#160d0f;--p2:#201316;--ln:#3a1a20;--ac:#e0233a;--ac2:#ff6b7d;--tx:#f2e6e8;--mut:#9a8085;--bub:#5a1520;--bubin:#201316;--glow:#e0233a26;color-scheme:dark}

.spinres{display:flex;justify-content:center}.spinres .card{width:200px;max-width:70vw}

.lot.ph{font-size:38px;opacity:.7}
.lot small{display:block}.lot .tag{position:absolute}
.mlot .row{flex-wrap:wrap}

</style></head><body>
<div id="auth">
 <h1>Rime</h1><small>Мессенджер с подарками, кейсами и крафтом</small>
 <input id="u" placeholder="@юзернейм" autocapitalize="none" autocomplete="username"><input id="d" placeholder="Имя (только при регистрации)">
 <input id="p" type="password" placeholder="Пароль" autocomplete="current-password">
 <div class="err" id="ae"></div><button class="pri" id="bl">Войти</button><button id="br">Создать аккаунт</button><button class="ghost" id="thAuth">Сменить тему</button>
</div>
<div id="app"><div id="top"><span class="logo">Rime</span><div id="tabs"></div><button id="theme" title="Тема оформления">Aa</button><button id="bell" title="Уведомления">🔔<b id="bn" style="display:none"></b></button><span id="rub"></span></div><div id="main"></div></div>
<div id="toast"></div><div id="pop"><div id="popc"></div></div>
<script src="/vendor/lottie.min.js"></script>
<script>
const $=s=>document.querySelector(s);let T=localStorage.rime_token||'',ME,CAT,timer,bellTimer,pendingOpen;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,b){let r;try{r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined,cache:'no-store'})}
 catch{throw new Error('Нет связи с сервером. Открой сайт через адрес сервера (http://localhost:8080), а не как файл.')}
 const j=await r.json().catch(()=>null);if(!j)throw new Error('Сервер вернул не ответ API. Запусти server.py и открой его адрес.');if(!r.ok)throw new Error(j.error||r.status);return j}
async function upload(file,kind){if(kind!=='game'&&!/\.(jpe?g|png|gif|mp4)$/i.test(file.name))throw new Error('Только jpg, png, gif, mp4');
 const r=await fetch('/api/upload?kind='+kind+(kind==='game'?'&name='+encodeURIComponent(file.name):''),{method:'POST',headers:{Authorization:'Bearer '+T},body:file});
 const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j.url||j.file}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2800)}
const wrap=f=>async(...a)=>{try{return await f(...a)}catch(e){toast(e.message)}};
const media=(u,c='')=>!u?'':/\.mp4$/.test(u)?`<video class="${c}" src="${u}" autoplay loop muted playsinline></video>`:`<img class="${c}" src="${u}" alt="">`;
const CHK={popular:['#3aa0ff','Популярный'],partner:['#2ecc71','Партнёр мессенджера'],major:['#f5c242','Мажор'],developer:['#a45bff','Разработчик']};
function badge(b){if(b==='owner')return `<svg class="bd" width="18" height="18" viewBox="0 0 20 20"><title>Владелец Rime</title><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset=".5" stop-color="#e0233a"/><stop offset=".5" stop-color="#000"/></linearGradient></defs><rect width="20" height="20" rx="5" fill="url(#rg)" stroke="#e0233a"/><text x="10" y="15" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" font-family="Arial">R</text></svg>`;
 const c=CHK[b];return c?`<svg class="bd" width="18" height="18" viewBox="0 0 20 20"><title>${c[1]}</title><circle cx="10" cy="10" r="10" fill="${c[0]}"/><path d="M5.5 10.5l3 3 6-6.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}
const orgMark=o=>o?`<span class="org" title="${esc(o.name)}">${o.icon?media(o.icon):esc(o.letter)}</span>`:'';
const av=(u,c='')=>u.avatar?media(u.avatar,'av '+c):`<span class="av ${c}">${esc((u.display||'?')[0].toUpperCase())}</span>`;
const nm=u=>`${orgMark(u.org)}${esc(u.display)}${badge(u.badge)}${u.username==='codexclyd'?' <span class="un">AVI 1.0</span>':''}${u.bot?' <span class="un">BOT</span>':''} <small>@${esc(u.username)}</small>`;
const isTgs=it=>(it.anim||/\.tgs$/i.test(it.img||''))&&it.img;
function pv(it,over){const hex=over?.hex??it.hex,sym=over?.symbol??it.symbol;
 return `<div class="pv" style="${hex?`background:radial-gradient(circle at 50% 38%,${hex},#000 165%)`:''}">${sym?`<div class="pat">${esc(sym.repeat(160))}</div>`:''}${isTgs(it)?`<div class="tgs" data-tgs="${esc(it.img)}"></div>`:(it.img?`<img src="${esc(it.img)}" alt="">`:'')}</div>`}
const TGS_P={},TGS_A=[];
function initTgs(root=document){
 if(!window.lottie)return;
 root.querySelectorAll('.tgs[data-tgs]:not([data-go])').forEach(el=>{
  el.dataset.go='1';const src=el.dataset.tgs||'';
  if(!/\.tgs$/i.test(src)){el.dataset.fail='1';return}
  const f=decodeURIComponent(src.replace(/^\//,''));
  if(!TGS_P[f])TGS_P[f]=fetch('/api/tgs?f='+encodeURIComponent(f)).then(r=>{if(!r.ok)throw 0;return r.json()});
  const start=()=>TGS_P[f].then(d=>{if(!el.isConnected)return;TGS_A.push([el,lottie.loadAnimation({container:el,renderer:'svg',loop:true,autoplay:true,animationData:d})])}).catch(()=>{el.dataset.fail='1'});
  start();
 });
 for(let i=TGS_A.length-1;i>=0;i--)if(!TGS_A[i][0].isConnected){TGS_A[i][1].destroy();TGS_A.splice(i,1)}
}
let tgsQ=0;
new MutationObserver(()=>{if(tgsQ)return;tgsQ=setTimeout(()=>{tgsQ=0;initTgs()},50)}).observe(document.body,{childList:true,subtree:true});
const card=(it,extra='')=>`<div class="card">${pv(it)}<b class="t-${esc(it.tier||'common')}">${esc(it.name)}</b><small>${it.backdrop?esc(it.backdrop)+' · '+esc(it.pattern||'')+' · ':''}${it.value??it.price??0} ◆</small>${extra}</div>`;
function musicEmbed(m){if(!m||!m.url)return '';const open=m.provider==='spotify'?'Открыть в Spotify':'Открыть в SoundCloud';
 if(m.provider==='spotify')return `<iframe class="mus" src="https://open.spotify.com/embed/${esc(m.url.split('/').slice(3).join('/'))}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="Spotify"></iframe><a class="mlink" href="${esc(m.url)}" target="_blank" rel="noopener">${open}</a>`;
 return `<iframe class="mus" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(m.url)}&color=%23e0233a&hide_related=true&show_comments=false&show_user=true" allow="autoplay" loading="lazy" title="SoundCloud"></iframe><a class="mlink" href="${esc(m.url)}" target="_blank" rel="noopener">${open}</a>`}
const TN={common:'обычная',rare:'редкая',epic:'эпическая',legendary:'легендарная'};
const THEMES={crimson:{n:'Багровый',ac:'#e0233a',bg:'#0b0708',tx:'#fff'},aurora:{n:'Аврора',ac:'#5b73f5',bg:'#f3f5fb',tx:'#1a2337'},midnight:{n:'Полночь',ac:'#5b8cff',bg:'#070b14',tx:'#e8eefc'},emerald:{n:'Изумруд',ac:'#22c98a',bg:'#05100b',tx:'#e3f7ee'}};
function applyTheme(n){if(!THEMES[n])n='crimson';document.documentElement.dataset.theme=n;try{localStorage.rime_theme=n}catch(e){}
 const m=$('#tc')||document.querySelector('meta[name=theme-color]');if(m)m.content=THEMES[n].bg;
 document.querySelectorAll('[data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th===n))}
applyTheme(localStorage.rime_theme||'crimson');

async admin(){let tab='users',smode='all';const L={popular:'Популярный',major:'Мажор',partner:'Партнёр мессенджера',developer:'Разработчик игры'};

  <h2 style="margin-top:12px">Выдать предмет</h2><div class="row"><select id="auK" style="flex:1"><optgroup label="Подарки">${CAT.gifts.map(g=>`<option value="gift|${esc(g.key)}">${esc(g.name)} · ${g.price}◆</option>`).join('')}</optgroup><optgroup label="Карточки">${(CAT.cards||[]).map(c=>`<option value="card|${esc(c.key)}">${esc(c.name)} · ${esc(c.tier)}</option>`).join('')}</optgroup></select><button class="pri sm" id="auI">Выдать</button></div>`);
  $('#auG').onclick=wrap(async()=>{const v=+$('#auR').value;if(!v)return;await api('admin/rubies',{username:u.username,amount:v});unpop();toast('Рубины обновлены');draw()});
  $('#auD').onclick=wrap(async()=>{await api('admin/reset_daily',{username:u.username});toast('Бонус дня сброшен')});
  $('#auS').onclick=wrap(async()=>{await api('admin/reset_spin',{username:u.username});toast('Таймер крутки сброшен')});
  $('#auI').onclick=wrap(async()=>{const [kind,key]=$('#auK').value.split('|');await api('admin/give',{username:u.username,kind,key});toast('Выдано: '+$('#auK').selectedOptions[0].textContent)})};
 const draw=async()=>{
  const tb=[['stats','Статистика'],['users','Люди'],['badge','Галочки'],['support','Поддержка'],['review','Отзывы'],['spins','Крутки'],['broadcast','Рассылка'],['settings','Настройки']];
  let h=`<div class="row" style="flex-wrap:wrap;margin-bottom:10px">${tb.map(t=>`<button class="sm ${t[0]===tab?'pri':''}" data-at="${t[0]}">${t[1]}</button>`).join('')}</div>`;
  if(tab==='stats'){const s=await api('admin/stats');
   h+=`<div class="statgrid">${[['Пользователи',s.users],['Новые за 24ч',s.new_users],['Предметы',s.items],['Карточки',s.cards],['Круток всего',s.spins],['Редких круток',s.spins_rare],['Круток за 24ч',s.spins_today],['Сообщения',s.messages],['Организации',s.orgs],['Лотов в продаже',s.listings],['Продано лотов',s.sold],['Оборот маркета',s.volume+' ◆'],['Рубинов в игре',s.rubies]].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('')}</div>
   <h2>Топ по рубинам</h2><table>${s.top.map(u=>`<tr><td>${nm(u)}</td><td>${u.rubies} ◆</td></tr>`).join('')||'<tr><td><small>Пусто</small></td></tr>'}</table>

  else if(tab==='users'){const us=(await api('admin/users')).users;const opt=['','popular','partner','major','developer'],lab={'':'нет',popular:'Популярный',partner:'Партнёр',major:'Мажор',developer:'Разработчик'};
   h+=`<table>${us.map(u=>`<tr><td>${nm(u)}<br><small>${u.items} предм. · ${u.cards} карт. · ${u.spins} круток</small></td><td>${u.rubies} ◆</td><td>${u.badge==='owner'?'R · владелец':`<select data-b="${esc(u.username)}">${opt.map(o=>`<option value="${o}" ${o===u.badge?'selected':''}>${lab[o]}</option>`).join('')}</select>`}</td>
   <td><input data-r="${esc(u.username)}" type="number" placeholder="± рубины" style="width:90px"> <button data-g="${esc(u.username)}" class="sm">OK</button> <button class="sm" data-ui="${esc(u.username)}">Ещё</button></td></tr>`).join('')}</table>`;
   setTimeout(()=>{document.querySelectorAll('[data-ui]').forEach(b=>b.onclick=()=>openUser(us.find(x=>x.username===b.dataset.ui)))},0)}
  else if(tab==='spins'){const s=(await api('admin/spins'+(smode!=='all'?'?mode='+smode:''))).spins;
   h+=`<div class="row" style="margin-bottom:8px">${['all','normal','rare'].map(x=>`<button class="sm ${x===smode?'pri':''}" data-sm="${x}">${{all:'Все',normal:'Обычные',rare:'Редкие'}[x]}</button>`).join('')}</div>
   <table><tr><th>Игрок</th><th>Карточка</th><th>Режим</th><th>Ценность</th><th>Когда</th></tr>${statRow(s)||'<tr><td colspan="5"><small>Пока пусто</small></td></tr>'}</table>`}
  else if(tab==='broadcast'){h+=`<div class="gap"><small>Сообщение придёт от Rime Bot каждому пользователю и в уведомления.</small><textarea id="bcT" rows="4" maxlength="1000" placeholder="Текст рассылки"></textarea><button class="pri" id="bcS">Отправить всем</button></div>`}
  else if(tab==='settings'){const {settings}=await api('admin/settings');
   h+=`<div class="gap"><label>Цена обычной крутки (◆)<input id="st1" type="number" value="${settings.cost}" min="10"></label><label>Цена редкой крутки (◆)<input id="st2" type="number" value="${settings.rare_cost}" min="10"></label><label>Перезарядка редкой крутки (сек)<input id="st3" type="number" value="${settings.rare_cd}" min="5"></label><button class="pri" id="stS">Сохранить</button><small>Новые значения применятся к следующим круткам. Диапазон цен: 10–100000, таймер: 5–86400 сек.</small></div>`}
  else{const r=await api('admin/requests?kind='+tab);
   h+=(tab==='review'&&r.avg?`<p>Средняя оценка: <b>${r.avg} / 5</b></p>`:'')+r.requests.map(x=>`<div class="card" style="margin-bottom:8px"><div><b>@${esc(x.username)}</b> ${tab==='badge'?'· хочет «'+L[x.badge]+'»':tab==='review'?'· '+'★'.repeat(x.rating):''} <small>${fmt(x.ts)} · ${x.status==='new'?'новая':'закрыта'}</small></div><div style="white-space:pre-wrap">${esc(x.text)}</div>
   ${x.status==='new'?(tab==='badge'?`<input placeholder="Комментарий (необязательно)" id="c${x.id}"><div class="row"><button class="pri sm" data-ap="${x.id}">Одобрить</button><button class="sm" data-rj="${x.id}">Отклонить</button></div>`:tab==='support'?`<textarea id="c${x.id}" rows="2" placeholder="Ответ через бота"></textarea><button class="pri sm" data-rp="${x.id}">Ответить</button>`:`<button class="sm" data-dn="${x.id}">Прочитано</button>`):`<small>${esc(x.result||'')}</small>`}</div>`).join('')||'<small>Пусто</small>'}
  $('#main').innerHTML='<h2>Админ-панель</h2>'+h;
  document.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{tab=b.dataset.at;draw()});
  document.querySelectorAll('[data-sm]').forEach(b=>b.onclick=()=>{smode=b.dataset.sm;draw()});
  document.querySelectorAll('[data-b]').forEach(s=>s.onchange=wrap(async()=>{try{await api('admin/badge',{username:s.dataset.b,badge:s.value});toast('Значок обновлён')}catch(e){toast(e.message);draw()}}));
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=wrap(async()=>{const v=+document.querySelector(`[data-r="${b.dataset.g}"]`).value;if(!v)return;await api('admin/rubies',{username:b.dataset.g,amount:v});draw()}));

  if($('#stS'))$('#stS').onclick=wrap(async()=>{const r=await api('admin/settings',{spin_cost:+$('#st1').value,rare_cost:+$('#st2').value,rare_cd:+$('#st3').value});CAT.spin=r.settings;ME.spin=r.settings;toast('Настройки сохранены')});
  const res=(sel,act)=>document.querySelectorAll(sel).forEach(b=>b.onclick=wrap(async()=>{const id=+Object.values(b.dataset)[0];await api('admin/resolve',{id,action:act,text:document.getElementById('c'+id)?.value||''});draw()}));

 await draw()}
};
